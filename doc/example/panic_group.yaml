Meta:
  ID: 1001
  Name: ThenGroup产生Panic测试
  Enabled: true
  GrayCount: 10000
  Priority: 100
  Owner: lizec
Filter:
  - Name: 判断事件
    When: Req.GetEvent() == 'event_test_thengroup'
    ThenList:
      - Sys.Import('VarPanic', 'Panic')
      - Sys.Log('Before Panic')
Action:
  - Name: 模拟并发panic
    When: true
    ThenGroup:
      - VarPanic.Panic('mock panic')
  - Name: 不执行后续的内容
    When: true
    ThenList:
      - Sys.Log('After Panic')
