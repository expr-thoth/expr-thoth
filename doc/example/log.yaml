Meta:
  ID: 1001
  Name: 日志插件测试
  Enabled: true
  GrayCount: 10000
  Priority: 100
  Owner: lizec
Filter:
  - Name: 判断事件
    When: Req.GetEvent() == 'event_log_test'
    ThenList:
      - Sys.Import('VarLog', 'Log')
Action:
  - Name: 输出日志
    When: true
    ThenList:
      - VarLog.Log('Test Log')
      - VarLog.Log(Req.GetEvent())
