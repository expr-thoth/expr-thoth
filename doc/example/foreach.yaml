Meta:
  ID: 1002
  Name: ForEach测试策略
  Enabled: true
  GrayCount: 10000
  Priority: 100
  Owner: lizec
Filter:
  - Name: 判断事件
    When: Req.GetEvent() == 'thoth_test_foreach'
Action:
  - Name: 设置基础标记
    When: true
    ThenList:
      - Sys.SetVar('VarCount', 0)
  - Name: 启动For循环
    When: VarCount == 0
    ForEach:
      Item: 1..10
      When: v % 2 != 0
      ThenList:
        - Sys.SetVar('VarCount', VarCount + v)
  - Name: 写入计算结果
    When: VarCount != 0
    ThenList:
      - Rsp.SetMsg('VarCount', string(VarCount))
