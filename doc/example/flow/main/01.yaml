Meta:
  ID: 1003
  Name: 高优先级测试实例
  Enabled: true
  GrayCount: 10000
  Priority: 1000
  Owner: lizec
Filter:
  - Name: 判断事件
    When: Req.GetEvent() == 'event_flow_test'
    ThenList:
      - Sys.SetVar('VarControlType', Req.Attrs['ControlType'])
Action:
  - Name: ExitGroup判断
    When: VarControlType == 'exit_group'
    ThenList:
      - Rsp.SetMsg('exit_group_thenlist', '1')
      - Sys.ExitGroup()
      - Rsp.SetMsg('after_exit_group_thenlist', '1')
  - Name: 兜底分支
    When: true
    ThenList:
      # 如果命中, 则文件中的其他Action也不执行
      - Rsp.SetMsg('after_exit_group_action', '1')
