Meta:
  ID: 1003
  Name: ThenGorup测试策略
  Enabled: true
  GrayCount: 10000
  Priority: 100
  Owner: lizec
Filter:
  - Name: 判断事件
    When: Req.GetEvent() == 'event_test_thengroup'
Action:
  - Name: 设置基础标记
    When: true
    ThenList:
      - |
        Sys.SetVar('VarSyncMap', Sys.Map.CreateSyncMap({'A': 10, 'B': 11}))
      - VarSyncMap.Set('C', 12)
  - Name: 并发设置属性
    When: true
    ThenGroup:
      - Sys.Log('Do Log Before')     
      - Sys.Log('Set D') 
      - VarSyncMap.Set('D', 13)
      - Sys.Log('Set E') 
      - VarSyncMap.Set('E', 14)
      - Sys.Log('Set F')       
      - VarSyncMap.Set('F', 15)
      - Sys.Log('Do Log After')             
  - Name: 写入结果
    When: VarSyncMap != nil
    ForEach:
      Item: VarSyncMap.ToMap()
      When: true
      ThenList:
        - Rsp.SetMsg(k, string(v))
